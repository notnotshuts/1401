[package]
name = "ferrite-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", features = ["oid"] }
plist.workspace = true

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
regex = "1"
rand = "0.8"
rsa = "0.9"
tempfile = "3"

fatfs = "0.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Ioctl", "Win32_System_SystemInformation", "Win32_Security", "Win32_Devices_DeviceAndDriverInstallation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
cc = "1"
