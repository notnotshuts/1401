name: Ferrite Rust
on:
  push:
    branches: [main, 'ferrite/**']
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'vendor/**', 'tools/**', 'licenses/**', 'docs/**', 'README.md', 'NOTICE.md', 'LICENSE', '.github/workflows/ferrite.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'vendor/**', 'tools/**', 'licenses/**', 'docs/**', 'README.md', 'NOTICE.md', 'LICENSE', '.github/workflows/ferrite.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ferrite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev acpica-tools xvfb xauth
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - name: Smoke-test CLI
        shell: bash
        run: |
          target/release/ferrite-cli --help
          target/release/ferrite-cli --language en guide "$RUNNER_TEMP/Guide-en.md"
      - name: Render UI previews
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          cargo build -p ferrite-desktop --features screenshot --locked
          xvfb-run -a python3 tools/ui/screenshots.py target/debug/ferrite dist/ui
      - name: UI screenshots
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-screenshots
          if-no-files-found: error
          path: dist/ui/*.png
      - name: Package Linux
        if: runner.os == 'Linux'
        run: python3 tools/package.py --platform linux
      - name: Package Windows
        if: runner.os == 'Windows'
        run: python tools/package.py --platform windows
      - name: Linux binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ferrite-linux-x86_64-preview
          if-no-files-found: error
          path: dist/*.tar.gz
      - name: Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ferrite-windows-x86_64-preview
          if-no-files-found: error
          path: dist/*.zip
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Native USB write on owned virtual disk
        run: python3 tools/macos/test_usb.py
      - run: cargo build --release --workspace --locked --target ${{ matrix.target }}
      - name: Validate native macOS adapters
        run: |
          target/${{ matrix.target }}/release/ferrite-cli snapshot "$RUNNER_TEMP/ferrite-scan"
          target/${{ matrix.target }}/release/ferrite-cli disks
      - name: Build and verify app bundle and DMG
        id: package
        run: python3 tools/macos/package.py --target ${{ matrix.target }} --skip-build
      - name: Verify CLI inside app bundle
        run: |
          arch="${{ matrix.target }}"
          arch="${arch%%-*}"
          "dist/macos/$arch/Ferrite.app/Contents/MacOS/ferrite-cli" --language en guide "$RUNNER_TEMP/Guide-en.md"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ferrite-macos-${{ matrix.target }}-preview
          if-no-files-found: error
          path: ${{ steps.package.outputs.dmg }}
  release:
    needs: [verify, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: ferrite-*-preview
          merge-multiple: true
          path: dist/release
      - name: Prepare checksums and release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, tomllib
          root = pathlib.Path('dist/release')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          expected = [f'Ferrite-{version}-{suffix}' for suffix in ['linux-x86_64.tar.gz', 'windows-x86_64.zip', 'aarch64.dmg', 'x86_64.dmg']]
          assert sorted(p.name for p in files) == sorted(expected), 'Missing or unexpected release package'
          for p in files:
              if p.parent != root:
                  p.rename(root / p.name)
          files = sorted(p for p in root.iterdir() if p.is_file())
          (root / 'SHA256SUMS').write_text(''.join(f'{hashlib.file_digest(p.open("rb"), "sha256").hexdigest()}  {p.name}\n' for p in files))
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          pathlib.Path('release-notes.md').write_text(f'Ferrite {version} preview.\n\nНовый интерфейс в стиле Apple: светлая, тёмная и системная темы, три этапа подготовки и меньше текста. [Скриншоты](https://github.com/{repo}/blob/{sha}/docs/ferrite/UI.md).\n\nLinux/Windows: распакуйте архив и держите GUI и CLI рядом. macOS: откройте DMG и перенесите приложение в Applications.\n\n[Инструкции и ограничения](https://github.com/{repo}/blob/{sha}/README.md). macOS поддерживает прямую запись USB с системным запросом прав администратора. Нативная запись проверена на отдельном виртуальном диске; проверка физических флешек остаётся отдельным этапом.\n\nСборки прошли fmt, строгий Clippy и Rust-тесты на Linux, Windows, macOS Intel и Apple Silicon. Загрузка macOS на физическом ПК этим не подтверждается.\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'FERRITE_VERSION={version}\nFERRITE_TAG=ferrite-v{version}-{sha[:12]}\n')
          PY
      - name: Publish Ferrite preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$FERRITE_TAG" >/dev/null 2>&1; then
            gh release upload "$FERRITE_TAG" dist/release/* --clobber
          else
            gh release create "$FERRITE_TAG" dist/release/* --target "$GITHUB_SHA" --title "Ferrite $FERRITE_VERSION preview" --notes-file release-notes.md --prerelease
          fi
