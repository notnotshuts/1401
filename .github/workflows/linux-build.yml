name: Linux build and verification
on:
  push:
    branches: [main, linux-port]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-certifi pciutils usbutils fdisk dosfstools udev xvfb acpica-tools python3-pip policykit-1 scrot
      - name: Prepare pinned CustomTkinter dependencies
        run: |
          python3 -m pip install --require-hashes --no-deps --target build/linux-vendor -r linux/requirements.txt
          echo "PYTHONPATH=$GITHUB_WORKSPACE/build/linux-vendor:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Test disk safety and shared engine regressions
        run: |
          python3 -m unittest discover -s tests -v
      - name: Exercise USB layout on a disposable loop image
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE" python3 tests/linux_loop_smoke.py
      - name: Build Linux packages
        run: python3 tools/linux_release.py --output dist/linux --vendor build/linux-vendor
      - name: Verify installed package and portable launcher
        run: |
          sudo apt-get install -y ./dist/linux/*.deb
          cd "$RUNNER_TEMP"
          1401 --help
          1401 disks
          mkdir -p "$RUNNER_TEMP/portable"
          tar -xzf "$GITHUB_WORKSPACE"/dist/linux/*.tar.gz -C "$RUNNER_TEMP/portable"
          "$RUNNER_TEMP/portable/1401-linux-x86_64/1401" --help
          cd "$GITHUB_WORKSPACE"
          xvfb-run -a env PYTHONPATH=/usr/lib/1401:/usr/lib/1401/vendor python3 tests/linux_gui_smoke.py --output dist/linux/ui
      - name: Build and validate a real corpus EFI with the installed Linux launcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json
          from tests.corpus.fetch import fetch_entry
          entries = json.load(open('tests/corpus/manifest.json'))['entries']
          print(fetch_entry(next(e for e in entries if e['slug'] == 'x570-5800x-6600xt')))
          PYCODE
          1401 check "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/Report.json" --macos 24 --output "$RUNNER_TEMP/compatibility.json"
          xvfb-run -a env PYTHONPATH=/usr/lib/1401:/usr/lib/1401/vendor python3 tests/linux_gui_smoke.py --report "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/Report.json" --analysis "$RUNNER_TEMP/compatibility.json" --output dist/linux/ui
          1401 build "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/Report.json" "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/ACPI" "$RUNNER_TEMP/corpus-efi" --macos 24
          1401 guide "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/Report.json" "$RUNNER_TEMP/corpus-efi" "$RUNNER_TEMP/BIOS.txt"
          sudo env PYTHONPATH=/usr/lib/1401:/usr/lib/1401/vendor python3 - "$RUNNER_TEMP/corpus-efi" <<'PYCODE'
          import sys
          from p1401 import linux_provenance, machine_handoff, validate
          with linux_provenance.for_profile(machine_handoff.verified(sys.argv[1])):
              result = validate.validate(sys.argv[1])
              assert result['ok'], result
          print('Root revalidation of ordinary-user build passed.')
          PYCODE
      - name: Retain GUI verification screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-ui-preview
          path: dist/linux/ui/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Linux packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 1401-linux-x86_64
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 30
