name: Linux build and verification
on:
  push:
    branches: [main, linux-port]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-certifi pciutils usbutils fdisk dosfstools udev xvfb acpica-tools python3-pip policykit-1 scrot
      - name: Prepare pinned CustomTkinter dependencies
        run: |
          python3 -m pip install --require-hashes --no-deps --target build/linux-vendor -r linux/requirements.txt
          echo "PYTHONPATH=$GITHUB_WORKSPACE/build/linux-vendor:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Test disk safety and shared engine regressions
        run: |
          python3 -m unittest discover -s tests -v
      - name: Exercise USB layout on a disposable loop image
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE" python3 tests/linux_loop_smoke.py
      - name: Build Linux packages
        run: python3 tools/linux_release.py --output dist/linux --vendor build/linux-vendor
      - name: Verify installed package and portable launcher
        run: |
          sudo apt-get install -y ./dist/linux/*.deb
          cd "$RUNNER_TEMP"
          1401 --help
          1401 disks
          mkdir -p "$RUNNER_TEMP/portable"
          tar -xzf "$GITHUB_WORKSPACE"/dist/linux/*.tar.gz -C "$RUNNER_TEMP/portable"
          "$RUNNER_TEMP/portable/1401-linux-x86_64/1401" --help
          cd "$GITHUB_WORKSPACE"
          xvfb-run -a env PYTHONPATH=/usr/lib/1401:/usr/lib/1401/vendor python3 tests/linux_gui_smoke.py --output dist/linux/ui
      - name: Exercise installed native Linux scanning and readable output
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE" python3 tests/linux_scan_integration.py
      - name: Build and validate a real corpus EFI with the installed Linux launcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json
          from tests.corpus.fetch import fetch_entry
          entries = json.load(open('tests/corpus/manifest.json'))['entries']
          print(fetch_entry(next(e for e in entries if e['slug'] == 'x570-5800x-6600xt')))
          PYCODE
          1401 check "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/Report.json" --macos 24 --output "$RUNNER_TEMP/compatibility.json"
          xvfb-run -a env PYTHONPATH=/usr/lib/1401:/usr/lib/1401/vendor python3 tests/linux_gui_smoke.py --report "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/Report.json" --analysis "$RUNNER_TEMP/compatibility.json" --output dist/linux/ui
          1401 build "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/Report.json" "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/ACPI" "$RUNNER_TEMP/corpus-efi" --macos 24
          runtime="$HOME/.cache/1401/runtime-$(cat /usr/lib/1401/LINUX_VERSION)"
          xvfb-run -a env PYTHONPATH="$runtime:$runtime/vendor" python3 tests/linux_gui_integration.py --report "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/Report.json"
          1401 guide "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/Report.json" "$RUNNER_TEMP/corpus-efi" "$RUNNER_TEMP/BIOS.txt"
          sudo env PYTHONPATH=/usr/lib/1401:/usr/lib/1401/vendor python3 - "$RUNNER_TEMP/corpus-efi" <<'PYCODE'
          import sys
          from p1401 import linux_provenance, machine_handoff, validate
          with linux_provenance.for_profile(machine_handoff.verified(sys.argv[1])):
              result = validate.validate(sys.argv[1])
              assert result['ok'], result
          print('Root revalidation of ordinary-user build passed.')
          PYCODE
      - name: Retain GUI verification screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-ui-preview
          path: dist/linux/ui/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Prepare complete release assets
        run: python3 tools/linux_release_assets.py --input dist/linux --output dist/release
      - name: Retain complete release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 1401-linux-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload Linux packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 1401-linux-x86_64
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 30

  mint-base:
    name: Verify Mint 22 / Ubuntu 24.04 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-certifi pciutils usbutils fdisk dosfstools udev xvfb acpica-tools python3-pip policykit-1 scrot
          python3 -m pip install --require-hashes --no-deps --target build/linux-vendor -r linux/requirements.txt
          echo "PYTHONPATH=$GITHUB_WORKSPACE/build/linux-vendor:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Test and install Mint-base packages
        run: |
          python3 -m unittest discover -s tests -q
          python3 tools/linux_release.py --output dist/linux --vendor build/linux-vendor
          sudo apt-get install -y ./dist/linux/*.deb
          xvfb-run -a env PYTHONPATH=/usr/lib/1401:/usr/lib/1401/vendor python3 tests/linux_gui_smoke.py --output dist/linux/ui
          sudo env PYTHONPATH="$GITHUB_WORKSPACE" python3 tests/linux_scan_integration.py
      - name: Fetch pinned report and test the actual desktop workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json
          from tests.corpus.fetch import fetch_entry
          entries = json.load(open('tests/corpus/manifest.json'))['entries']
          print(fetch_entry(next(e for e in entries if e['slug'] == 'x570-5800x-6600xt')))
          PYCODE
          1401 --help
          runtime="$HOME/.cache/1401/runtime-$(cat /usr/lib/1401/LINUX_VERSION)"
          xvfb-run -a env PYTHONPATH="$runtime:$runtime/vendor" python3 tests/linux_gui_integration.py --report "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/Report.json"

  installer:
    name: Live Apple USB and UEFI boot evidence
    needs: [linux, mint-base]
    # HfsPlus enables AVX at entry. QEMU 6.2 TCG on 22.04 cannot emulate it;
    # 24.04 supplies QEMU 8.2 with AVX, keeping the actual EFI driver intact.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact tested package and virtual firmware dependencies
        run: |
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name 1401-linux-release --dir packages
          cd packages
          sha256sum -c SHA256SUMS
          cd ..
          sudo apt-get update
          sudo apt-get install -y ./packages/*.deb xvfb scrot qemu-system-x86 ovmf tesseract-ocr python3-pil
      - name: Fetch pinned hardware fixture
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python3 - <<'PYCODE'
          import json
          from tests.corpus.fetch import fetch_entry
          entries = json.load(open('tests/corpus/manifest.json'))['entries']
          print(fetch_entry(next(e for e in entries if e['slug'] == 'x570-5800x-6600xt')))
          PYCODE
      - name: Real GUI wizard, live Apple download, USB write and UEFI picker
        run: |
          1401 --help
          runtime="$HOME/.cache/1401/runtime-$(cat /usr/lib/1401/LINUX_VERSION)"
          xvfb-run -a -s '-screen 0 1600x1000x24' env PYTHONPATH="$runtime:$runtime/vendor" python3 tests/linux_gui_integration.py --report "$GITHUB_WORKSPACE/tests/corpus/cache/x570-5800x-6600xt/Report.json" --output dist/installer-evidence --usb-test
      - name: Pack evidence without recovery images or disk contents
        if: always()
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          import zipfile
          root = Path('dist/installer-evidence'); root.mkdir(parents=True, exist_ok=True)
          (root / 'READ-ME.txt').write_text('Тестовый ПК: закреплённый x570/5800X/6600XT из корпуса.\nВыполнены реальные операции GUI и установленного Linux USB backend на принадлежащем тесту loop-образе.\nApple Recovery загружен непосредственно с Apple и проверен по подписи и всем блокам; файлы Apple и образ диска не распространяются.\nДля экрана UEFI в тестовой копии EFI включён Builtin picker, Timeout=0 и serial debug. Аппаратные настройки сохранены.\nЭто проверка меню OpenCore в OVMF/QEMU, не загрузки ядра macOS или физического ПК.\nActions: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n')
          files = sorted(p for p in root.iterdir() if p.suffix in ('.png', '.json', '.txt') and p.is_file())
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          archive = Path('dist/installer-evidence.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in files + [root / 'SHA256SUMS']: z.write(p, p.name)
          Path('dist/installer-evidence.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + archive.name + '\n')
          if (root / 'installer-test.json').exists():
              result = json.loads((root / 'installer-test.json').read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Live USB integration\n\n```json\n' + json.dumps(result, indent=2)[:8000] + '\n```\n')
          PYCODE
      - name: Retain all screenshots and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-ci-evidence
          path: |
            dist/installer-evidence.zip
            dist/installer-evidence.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Linux release
    needs: [linux, mint-base, installer]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: linux-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_RUN: ${{ github.run_id }}
    steps:
      - name: Download the verified assets from this exact workflow run
        run: gh run download "$RELEASE_RUN" --name 1401-linux-release --dir release
      - name: Verify every release asset
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Include verified installer screenshots and test evidence
        run: |
          gh run download "$RELEASE_RUN" --name installer-ci-evidence --dir evidence
          cd evidence
          sha256sum -c installer-evidence.sha256
          cd ..
          cp evidence/installer-evidence.zip release/
          cd release
          sha256sum installer-evidence.zip >> SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish the complete release
        shell: bash
        run: |
          set -euo pipefail
          tag="linux-${RELEASE_SHA:0:12}"
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          latest=false
          if [[ "$current" == "$RELEASE_SHA" ]]; then latest=true; fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Linux x86_64: интерфейс CustomTkinter, проверка железа OpCore-Simplify, сборка EFI и запись USB.

          Вложения: пакет Ubuntu/Debian (.deb), переносимый архив (.tar.gz), SHA256SUMS для всех файлов, скриншоты, README, инструкция, лицензии и installer-evidence.zip с полным набором скриншотов и результатами USB/UEFI-теста.

          Установка: скачайте .deb и выполните \`sudo apt install ./p1401-linux_*_amd64.deb\`, затем \`1401 gui\`.

          Исправлено обнаружение USB-разделов: явное дерево устройств lsblk, проверка нового раздела по ядру и источника монтирования перед копированием. Интерфейс показывает накопитель и его разделы отдельно.

          Исправлены запросы Apple Recovery: HTTPS для сессии/метаданных и однократное обновление сессии при 401/403. Проверка подписи Apple и всех блоков обязательна до очистки диска.

          Перед публикацией прошли тесты, GUI под Xvfb, сборка EFI, полная загрузка Recovery с Apple, запись и повторная проверка loop-образа, загрузка OpenCore в QEMU/OVMF. Только в тестовой копии включены Timeout=0 и serial debug для скриншота меню. Физический USB и загрузка ядра macOS требуют проверки на вашем ПК.

          Исходный коммит: $RELEASE_SHA
          Проверки Actions: https://github.com/$GH_REPO/actions/runs/$RELEASE_RUN
          EOF
          if gh release view "$tag" > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            # A rerun never duplicates or replaces an already published release.
            draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            if [[ "$draft" == "false" ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --target "$RELEASE_SHA" --draft --title "1401 Linux · ${RELEASE_SHA:0:12}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" release/* --clobber
          gh release edit "$tag" --draft=false --latest="$latest" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$tag" --json url --jq '.url'
