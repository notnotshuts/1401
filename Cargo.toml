[workspace]
members = ["crates/ferrite-core", "crates/ferrite-cli", "crates/ferrite-desktop"]
resolver = "2"
exclude = ["vendor/fatfs"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
plist = "1.7"
ferrite-core = { path = "crates/ferrite-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[profile.dev.package.sha2]
opt-level = 3

[patch.crates-io]
fatfs = { path = "vendor/fatfs" }
